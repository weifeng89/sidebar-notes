name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    if: github.event_name == 'push'
    needs: checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check release configuration
        run: bun run check:platform

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build DarwinKit sidecar (Apple Silicon)
        run: |
          cd src-tauri/darwinkit
          mkdir -p ../binaries

          swift build -c release --arch arm64
          cp .build/arm64-apple-macosx/release/darwinkit ../binaries/darwinkit-aarch64-apple-darwin
          file ../binaries/darwinkit-aarch64-apple-darwin

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release (aarch64)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: 'Sidebar Notes v__VERSION__'
          releaseBody: 'See the repository README for the Apple Silicon build and installation details.'
          releaseDraft: true
          prerelease: false
          # --bundles app,updater: skip tauri-bundler's bundle_dmg.sh
          # which dies ~10s into AppleScript icon positioning on the
          # current runner. We build the DMG ourselves in a later step.
          args: --target aarch64-apple-darwin --bundles app,updater

      - name: Build signed DMGs and upload to release
        # Tauri's bundle_dmg.sh / hdiutil / AppleScript pipeline keeps
        # flaking on the ephemeral macOS runner. Build DMGs ourselves
        # with a single `hdiutil create`: simple, deterministic,
        # fully visible in the logs. Each DMG is signed with the same
        # Developer ID identity the tauri-action step used and uploaded
        # to this repository's draft release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          RUST_TARGET="aarch64-apple-darwin"
          APP_PATH="src-tauri/target/${RUST_TARGET}/release/bundle/macos/Sidebar Notes.app"
          DMG_NAME="Sidebar-Notes_${VERSION}_aarch64.dmg"
          DMG_PATH="${RUNNER_TEMP}/${DMG_NAME}"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected .app not found at $APP_PATH"
            ls -la "$(dirname "$APP_PATH")" || true
            exit 1
          fi

          echo "==> Creating $DMG_NAME from $APP_PATH"
          hdiutil create \
            -volname "Sidebar Notes" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "==> Signing $DMG_NAME"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          echo "==> Uploading $DMG_NAME to draft release"
          gh release upload "v${VERSION}" "$DMG_PATH" --clobber
